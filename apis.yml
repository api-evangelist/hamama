aid: hamama
name: HAMAMA
description: >-
  Hamama is a West Sacramento, California consumer-products company that makes
  it easy to grow fresh microgreens at home. Founded by two MIT-trained
  mechanical engineers, Hamama sells self-watering microgreen grow kits and its
  signature pre-seeded "Seed Quilts" (non-GMO, mostly Certified Organic) that
  sprout edible greens in 7-10 days with nothing more than a single addition of
  water, no soil, pesticides, or fertilizer required. The company sells grow
  kits, ceramic trays, Seed Quilt refills, green-onion and mushroom kits, and
  accessories directly to consumers through its Shopify storefront, offers
  flexible subscribe-and-save refill plans, and supports growers with Growing
  Guides, recipes, a rewards program, and a Grow Coach customer-support team.
